<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Share image render</title>
<!-- Renders one 1200x630 link-preview image. Driven by URL params:
     ?t=Title&k=Kicker&s=Subtitle&jp=漢字&img=characters/xiraiya.webp&pet=characters/gama.webp&c=%23c4321d&tags=a|b|c&url=domain -->
<link rel="stylesheet" href="fonts/fonts.css">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0e0b09; }
.og { --c: #c4321d; position: relative; width: 1200px; height: 630px; overflow: hidden; isolation: isolate; background: radial-gradient(ellipse at 78% 38%, #2a1a12 0%, #140f0b 52%, #0b0907 100%); color: #f3e9d6; font-family: 'Zen Kaku Gothic New', sans-serif; }
.grain { position: absolute; inset: 0; z-index: 3; opacity: .07; background-image: radial-gradient(#fff 1px, transparent 1.2px); background-size: 4px 4px; mix-blend-mode: overlay; pointer-events: none; }
.sun { position: absolute; right: 70px; top: 44px; width: 470px; height: 470px; border-radius: 50%; z-index: -2; background: radial-gradient(circle at 40% 35%, color-mix(in srgb, var(--c) 60%, #ffb088), var(--c) 55%, color-mix(in srgb, var(--c) 60%, #000)); box-shadow: 0 0 120px 10px color-mix(in srgb, var(--c) 40%, transparent); }
.sun::before, .sun::after { content: ''; position: absolute; left: 6%; right: 46%; height: 4%; border-radius: 99px; background: rgba(20, 15, 11, .55); }
.sun::before { top: 64%; } .sun::after { top: 72%; left: 14%; right: 56%; height: 2.6%; }
.ring { position: absolute; right: 38px; top: 12px; width: 534px; height: 534px; border-radius: 50%; border: 1.5px solid color-mix(in srgb, var(--c) 45%, transparent); z-index: -2; }
.peaks { position: absolute; left: 0; right: 0; bottom: 0; height: 250px; z-index: -1; }
.kanji { position: absolute; left: 520px; top: -40px; z-index: -1; font: 800 360px/1 'Shippori Mincho B1', serif; color: transparent; -webkit-text-stroke: 1.5px rgba(243, 233, 214, .07); }
.art { position: absolute; right: 118px; bottom: -8px; height: 612px; z-index: 1; filter: drop-shadow(0 30px 40px rgba(0, 0, 0, .55)); }
.pet { position: absolute; right: 18px; bottom: -4px; height: 190px; z-index: 2; filter: drop-shadow(0 16px 20px rgba(0, 0, 0, .5)); }
.left { position: absolute; left: 66px; top: 56px; bottom: 50px; width: 590px; display: flex; flex-direction: column; z-index: 2; }
.brand { display: flex; align-items: center; gap: 14px; }
.mark { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 10px; background: var(--c); font: 800 24px 'Shippori Mincho B1', serif; color: #fff8ee; box-shadow: inset 0 0 0 2px var(--c), inset 0 0 0 4px rgba(255, 248, 238, .75); transform: rotate(-4deg); }
.brand b { font: 800 26px 'Shippori Mincho B1', serif; letter-spacing: .14em; }
.brand span { font: 500 13px 'JetBrains Mono', monospace; letter-spacing: .2em; text-transform: uppercase; color: #b9aa90; margin-left: 6px; }
.kick { margin-top: 54px; display: inline-flex; align-items: center; gap: 12px; font: 700 15px 'JetBrains Mono', monospace; letter-spacing: .22em; text-transform: uppercase; color: color-mix(in srgb, var(--c) 45%, #ffd9c4); }
.kick::before { content: ''; width: 34px; height: 3px; background: var(--c); }
h1 { margin: 16px 0 0; font: 800 60px/1.06 'Shippori Mincho B1', serif; letter-spacing: -.01em; text-wrap: balance; }
h1 em { font-style: normal; color: color-mix(in srgb, var(--c) 70%, #ffb088); }
p { margin: 22px 0 0; max-width: 540px; font: 500 24px/1.4 'Zen Kaku Gothic New', sans-serif; color: #d9ccb4; }
.foot { margin-top: auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.tag { padding: 9px 16px; border-radius: 99px; border: 1.5px solid rgba(243, 233, 214, .22); font: 700 15px 'Zen Kaku Gothic New', sans-serif; color: #efe4cc; background: rgba(243, 233, 214, .04); }
.url { position: absolute; left: 66px; bottom: 18px; font: 500 13px 'JetBrains Mono', monospace; letter-spacing: .08em; color: #8f826c; }
</style>
</head>
<body>
<div class="og" id="og">
  <div class="ring"></div><div class="sun"></div>
  <div class="kanji" id="jp"></div>
  <svg class="peaks" viewBox="0 0 1200 250" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 160 L140 90 L240 140 L380 60 L520 150 L640 100 L760 170 L900 80 L1040 150 L1200 100 L1200 250 L0 250Z" fill="#1c1510"/>
    <path d="M0 210 L160 150 L300 200 L460 130 L620 200 L780 150 L940 210 L1100 160 L1200 190 L1200 250 L0 250Z" fill="#120d0a"/>
  </svg>
  <img class="art" id="art" alt="">
  <img class="pet" id="pet" alt="">
  <div class="left">
    <div class="brand"><span class="mark">忍</span><b>XIRAIYA</b><span>Full-stack developer</span></div>
    <span class="kick" id="k"></span>
    <h1 id="t"></h1>
    <p id="s"></p>
    <div class="foot" id="tags"></div>
  </div>
  <div class="url" id="url"></div>
  <div class="grain"></div>
</div>
<script>
  var q = new URLSearchParams(location.search), $ = function (i) { return document.getElementById(i); };
  var og = $('og');
  og.style.setProperty('--c', q.get('c') || '#c4321d');
  $('k').textContent = q.get('k') || '';
  $('t').innerHTML = (q.get('t') || 'Xiraiya').replace(/\*(.+?)\*/g, '<em>$1</em>');
  $('s').textContent = q.get('s') || '';
  $('jp').textContent = q.get('jp') || '忍';
  $('url').textContent = q.get('url') || '';
  $('tags').innerHTML = (q.get('tags') || '').split('|').filter(Boolean).map(function (t) { return '<span class="tag">' + t + '</span>'; }).join('');
  $('art').src = '../assets/img/' + (q.get('img') || 'characters/xiraiya.webp');
  if (q.get('pet')) $('pet').src = '../assets/img/' + q.get('pet'); else $('pet').remove();
</script>
</body>
</html>
