<!doctype html>
<html lang="en">
<head>

<title>OG cover render</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Shippori+Mincho+B1:wght@500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../assets/css/core.css">
<style>
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0f0d0b; }
.grain, .curtain, .progress, .toasts, .tabbar { display: none !important; }
.og { position: relative; width: 1200px; height: 630px; overflow: hidden; isolation: isolate; background: linear-gradient(180deg, #0c0a08, #17120e 60%, #1f1812); }
.sun { position: absolute; right: 90px; top: 60px; width: 430px; height: 430px; border-radius: 50%; z-index: -2; background: radial-gradient(circle at 42% 38%, #ef6a4c, #e0442e 46%, #b8321f); }
.sun::before { content: ''; position: absolute; left: -18%; width: 78%; top: 60%; height: 6%; border-radius: 99px; background: #17120e; }
.peaks { position: absolute; left: 0; right: 0; bottom: 0; height: 330px; z-index: -1; }
.peaks svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.left { position: absolute; left: 64px; top: 58px; bottom: 54px; width: 640px; display: flex; flex-direction: column; }
.kick { display: flex; align-items: center; gap: 14px; font: 500 14px/1 'JetBrains Mono', monospace; letter-spacing: .22em; text-transform: uppercase; color: #bfb29a; }
.title { position: relative; margin-top: 42px; display: flex; align-items: flex-start; gap: 18px; }
.title svg { position: absolute; left: -20px; bottom: -14px; width: 560px; height: 70px; }
.title b { position: relative; font: 800 112px/.9 'Shippori Mincho B1', serif; letter-spacing: .03em; color: #efe4cc; }
.seal { display: grid; gap: 2px; padding: 9px 6px; font: 800 24px/1 'Shippori Mincho B1', serif; color: #fbf1dc; background: #e0442e; box-shadow: inset 0 0 0 2px #e0442e, inset 0 0 0 4px rgba(251,241,220,.8); transform: rotate(4deg); margin-top: 6px; }
h1 { margin: 34px 0 0; font: 700 38px/1.18 'Shippori Mincho B1', serif; color: #efe4cc; }
h1 em { font-style: normal; color: #e0442e; }
.meta { margin-top: auto; display: flex; gap: 22px; padding-top: 14px; border-top: 1px solid rgba(239,228,204,.2); font: 700 18px/1 'Shippori Mincho B1', serif; color: #efe4cc; }
.meta span + span { padding-left: 22px; border-left: 1px solid rgba(239,228,204,.18); }
.mascot { position: absolute; right: 40px; bottom: -6px; width: 400px; }
</style>
</head>
<body>
<div class="og">
  <div class="sun"></div>
  <div class="peaks"><svg viewBox="0 0 1600 600" preserveAspectRatio="xMidYMax slice"><path d="M0 600V352C58 342 86 262 136 250 188 238 204 334 256 324 306 312 324 190 384 176 446 164 456 300 524 292 594 284 604 226 662 214 724 202 742 318 804 310 872 302 884 152 954 142 1024 134 1032 290 1102 282 1162 274 1182 232 1244 222 1306 212 1322 330 1384 322 1444 314 1472 252 1522 246 1562 242 1582 296 1600 298V600Z" fill="#3b3129" opacity=".55"/><path d="M0 600V438C70 430 98 336 168 326 232 318 250 424 318 414 380 404 404 300 474 296 546 292 566 432 640 424 716 416 744 356 806 352 874 348 890 452 962 444 1034 436 1054 330 1126 324 1196 318 1214 440 1282 434 1346 428 1372 380 1432 376 1500 372 1530 440 1600 436V600Z" fill="#231c16"/><path d="M0 600V520C96 506 150 470 230 478 312 486 340 530 430 522 520 514 560 470 650 474 744 478 770 528 870 522 966 516 1010 482 1100 486 1196 490 1224 532 1320 526 1410 520 1452 492 1530 494 1566 495 1590 504 1600 506V600Z" fill="#0f0d0b"/></svg></div>
  <div class="left">
    <div class="kick"><span class="hanko sm">忍</span>The toad sage of code · Rajshahi, Bangladesh</div>
    <div class="title">
      <svg viewBox="0 0 1000 160" preserveAspectRatio="none"><path d="M14 92C120 58 330 40 560 44 720 46 880 58 988 70 996 72 996 90 984 92 860 110 690 124 520 126 330 128 150 124 24 118 6 116 2 98 14 92Z" fill="#e0442e"/></svg>
      <b>XIRAIYA</b><span class="seal"><span>児</span><span>雷</span><span>也</span></span>
    </div>
    <h1>Websites, bots, apps &amp; <em>AI agents</em> that work while you sleep.</h1>
    <div class="meta"><span>5+ years</span><span>11 services</span><span>Live demos of everything</span></div>
  </div>
  <div class="mascot" data-mascot></div>
</div>

</html>
