name: Shop photos

# Fetches the free-licence product photos for the Shop demo.
# Pushing tools/shop-photos/request.json builds contact sheets to choose from;
# pushing tools/shop-photos/select.json downloads the chosen photos.
on:
  push:
    paths:
      - 'tools/shop-photos/request.json'
      - 'tools/shop-photos/select.json'

permissions:
  contents: write

concurrency:
  group: shop-photos-${{ github.ref }}

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install sharp
        run: npm i --no-save --no-package-lock sharp@0.33
      - name: Pick mode
        id: mode
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q 'tools/shop-photos/select.json'; then echo "m=final" >> "$GITHUB_OUTPUT"; else echo "m=candidates" >> "$GITHUB_OUTPUT"; fi
      - name: Fetch
        env:
          SKIP_UNSPLASH: '1'
        run: node tools/shop-photos/fetch.mjs ${{ steps.mode.outputs.m }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tools/shop-photos
          [ -d assets/img/shop ] && git add -A assets/img/shop
          git diff --cached --quiet && exit 0
          git commit -m "Shop photos: ${{ steps.mode.outputs.m }}"
          git push origin HEAD:${{ github.ref_name }}
