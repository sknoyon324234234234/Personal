name: Deploy site

# GitHub Pages serves the gh-pages branch. Every push to main copies main
# there, and Pages rebuilds the site by itself a minute later.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy main to gh-pages
        run: git push --force origin HEAD:refs/heads/gh-pages
